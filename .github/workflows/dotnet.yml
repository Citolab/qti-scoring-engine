name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing: lets GitHub issue the OIDC token

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
    - name: Pack
      run: dotnet pack Scoring/ScoringEngine.csproj --configuration Release --no-build --no-restore --output ./nupkgs

    # Publish only from main. Pull requests build and test, but never push a package:
    # fork PRs cannot get a usable OIDC token, and a PR should not be able to release.
    - name: NuGet login (exchange OIDC token for a 1-hour API key)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet nuget push nupkgs/Citolab.QTI.ScoringEngine.*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
